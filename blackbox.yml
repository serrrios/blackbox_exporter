modules:
  http_2xx:
    prober: http
    http:
      preferred_ip_protocol: "ip4"
  http_post_2xx:
    prober: http
    http:
      method: POST
  tcp_connect:
    prober: tcp
  pop3s_banner:
    prober: tcp
    tcp:
      query_response:
      - expect: "^+OK"
      tls: true
      tls_config:
        insecure_skip_verify: false
  grpc:
    prober: grpc
    grpc:
      tls: true
      preferred_ip_protocol: "ip4"
  grpc_plain:
    prober: grpc
    grpc:
      tls: false
      service: "service1"
  ssh_banner:
    prober: tcp
    tcp:
      query_response:
      - expect: "^SSH-2.0-"
      - send: "SSH-2.0-blackbox-ssh-check"
  ssh_banner_extract:
    prober: tcp
    timeout: 5s
    tcp:
      query_response:
      - expect: "^SSH-2.0-([^ -]+)(?: (.*))?$"
        labels:
        - name: ssh_version
          value: "${1}"
        - name: ssh_comments
          value: "${2}"
  irc_banner:
    prober: tcp
    tcp:
      query_response:
      - send: "NICK prober"
      - send: "USER prober prober prober :prober"
      - expect: "PING :([^ ]+)"
        send: "PONG ${1}"
      - expect: "^:[^ ]+ 001"
  icmp:
    prober: icmp
  icmp_ttl5:
    prober: icmp
    timeout: 5s
    icmp:
      ttl: 5
  http_3xx:
    prober: http
    http:
      preferred_ip_protocol: "ip4"
      enable_http3: true
      enable_http2: false
      valid_http_versions: ["HTTP/3.0"]
  # Полный шаблон openssl_http: все поля OpenSSLHTTPProbe (остальное — по умолчанию в коде).
  # OpenSSL 1.1.x + GOST: используйте openssl_engine. OpenSSL 3.x + gost provider: openssl_provider* (без engine).
  openssl_http_2xx:
    prober: openssl_http
    timeout: 15s
    openssl_http:
      valid_status_codes: [200, 201, 202, 204, 301, 302, 303, 307, 308, 401, 403, 404, 429, 500, 502, 503]
      valid_http_versions: ["HTTP/1.0", "HTTP/1.1"]
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: true
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: false
      method: GET
      headers:
        User-Agent: "BlackboxExporter/openssl_http"
        Accept: "*/*"
      accept_any_response: false
      compression: ""
      body_size_limit: 10MB
      tls_config:
        insecure_skip_verify: false
        # server_name: "override-sni.example.com"
        # ca_file: "/etc/pki/tls/certs/ca-bundle.crt"
        # cert_file: "/path/to/client.pem"
        # key_file: "/path/to/client.key"
      openssl_binary: "/usr/bin/openssl"
      openssl_engine: "gost"
